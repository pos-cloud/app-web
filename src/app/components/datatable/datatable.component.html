<section class="container-fluid">
  <div class="card card-large">
    <div class="card-header">
      <span class="datatable-title">{{ title | translate | capitalize }}</span>
      <button
        type="button"
        class="btn btn-light datatable-filter-toggle"
        (click)="advancedFiltersOpen = !advancedFiltersOpen"
        [class.is-open]="advancedFiltersOpen"
      >
        <i class="fa fa-filter"></i>
        <span>Filtros avanzados</span>
        <i class="fa" [ngClass]="advancedFiltersOpen ? 'fa-angle-up' : 'fa-angle-down'"></i>
      </button>
      <div class="datatable-header-actions">
        <button
          *ngFor="let button of headerButtons"
          [type]="'button'"
          [class]="button.class"
          (click)="runEvent(button.click, null, null)"
          [disabled]="loading"
        >
          <i [class]="button.icon"></i><span>{{ button.title | translate | capitalize }}</span>
        </button>
        <app-export-excel
          *ngIf="exportPermision"
          #exportExcelComponent
          [title]="title"
          [loading]="loading"
          [columns]="columns"
          (eventExport)="exportItems()"
        ></app-export-excel>
        <div class="columns-area" ngbDropdown>
          <button
            class="btn btn-light"
            type="button"
            id="user"
            ngbDropdownToggle
            aria-haspopup="true"
            aria-expanded="false"
          >
            <i class="fa fa-columns"></i><span>{{ 'columns' | translate | capitalize }}</span>
          </button>
          <div ngbDropdownMenu class="columns-dropdown-menu">
            <app-columns-config
              [columns]="columns"
              (columnsChange)="onColumnsChange($event)"
              (visibilityChange)="saveColumnVisibility()"
            ></app-columns-config>
          </div>
        </div>
      </div>
    </div>
    <div class="datatable-filter-bar" [class.is-open]="advancedFiltersOpen">
      <div class="datatable-filter-fields">
        <ng-content select="[datatableFilters]"></ng-content>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th [width]="50">
              <i class="fa fa-bars"></i>
            </th>
            <ng-container *ngFor="let column of columns">
              <th *ngIf="column.visible" (click)="orderBy(column.name)">
                <i *ngIf="sort[column.name] === 1" class="fa fa-sort-up"></i>
                <i *ngIf="sort[column.name] === -1" class="fa fa-sort-down"></i>
                <i *ngIf="!sort[column.name]" class="fa fa-sort"></i>
                {{ column.name | translate | capitalize }}
              </th>
            </ng-container>
          </tr>
          <tr class="filters">
            <th></th>
            <ng-container *ngFor="let column of columns">
              <th *ngIf="column.visible">
                <input
                  *ngIf="column.datatype !== 'boolean'"
                  type="text"
                  class="form-control"
                  [ngClass]="{
                    disabled: loading,
                    enabled: !loading,
                    'has-data': filters[column.name],
                  }"
                  [(ngModel)]="filters[column.name]"
                  (keydown.enter)="addFilters()"
                  placeholder="{{ column.name | translate | capitalize }}"
                  [disabled]="!column.filter || loading"
                  #filterInput
                />
                <select
                  class="form-control"
                  *ngIf="column.datatype === 'boolean'"
                  [(ngModel)]="filters[column.name]"
                  (change)="addFilters()"
                  #filterInput
                >
                  <option
                    value=""
                    [ngClass]="{ disabled: loading, enabled: !loading }"
                    [disabled]="!column.filter || loading"
                  >
                    {{ 'select filter' | translate | capitalize }}
                  </option>
                  <option
                    [value]="true"
                    [ngClass]="{ disabled: loading, enabled: !loading }"
                    [disabled]="!column.filter || loading"
                  >
                    {{ 'true' | translate | capitalize }}
                  </option>
                  <option
                    [value]="false"
                    [ngClass]="{ disabled: loading, enabled: !loading }"
                    [disabled]="!column.filter || loading"
                  >
                    {{ 'false' | translate | capitalize }}
                  </option>
                </select>
              </th>
            </ng-container>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td
              *ngIf="loading"
              [attr.colspan]="_datatableService.getColumnsVisibles() + 1"
              style="padding: 0px; height: 5px"
            >
              <app-progressbar [loading]="loading"></app-progressbar>
            </td>
          </tr>
          <tr *ngFor="let item of items" style="cursor: pointer">
            <td align="left">
              <ng-container *ngFor="let button of rowButtons">
                <button
                  *ngIf="isRowButtonVisible(button, item)"
                  [type]="'button'"
                  [class]="button.class"
                  (click)="runEvent(button.click, item, items)"
                  [disabled]="loading"
                  [title]="button.title | translate | capitalize"
                >
                  <i [class]="button.icon"></i>
                </button>
              </ng-container>
            </td>
            <ng-container *ngFor="let column of columns">
              <td
                *ngIf="column.visible && column.datatype !== 'boolean'"
                [attr.align]="column.align"
                (click)="onRowClick(item)"
              >
                {{ getValue(item, column) }}
              </td>
              <td *ngIf="column.visible && column.datatype === 'boolean'" [attr.align]="column.align">
                <input type="checkbox" [checked]="getValue(item, column)" disabled />
              </td>
            </ng-container>
          </tr>
          <tr align="center" *ngIf="totalItems === 0 && !loading">
            <td [attr.colspan]="_datatableService.getColumnsVisibles() + 1">
              {{ 'no data found' | translate | capitalize }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer">
      <div class="row">
        <div class="col">
          <ngb-pagination
            *ngIf="itemsPerPage < totalItems"
            [collectionSize]="totalItems"
            [(page)]="currentPage"
            [maxSize]="5"
            [boundaryLinks]="true"
            [pageSize]="itemsPerPage"
            (pageChange)="pageChange($event)"
          ></ngb-pagination>
          <span class="records-count" *ngIf="!loading">{{ totalItems }} registros</span>
        </div>
        <div class="col text-right">
          <div ngbDropdown placement="top-right">
            <button ngbDropdownToggle class="btn btn-light">
              {{ 'show ' + itemsPerPage + ' records' | translate | capitalize }}
            </button>
            <div ngbDropdownMenu>
              <button
                class="dropdown-item"
                *ngFor="let value of [5, 10, 20, 50, 100, 500, 1000, 1000000]"
                (click)="selectItemsPerPage(value)"
              >
                {{ 'show ' + value + ' records' | translate | capitalize }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
