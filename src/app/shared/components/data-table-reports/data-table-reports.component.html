<div class="card card-large">
  <div class="card-header">
    <span style="color: #607d8b">{{ title | translate | capitalize }}</span>
    <div class="pull-right">
      <button *ngIf="showBack" type="button" class="btn btn-light mr-2" (click)="eventBack.emit()">
        <i class="fa fa-arrow-left"></i>
        <span>{{ 'return' | translate | capitalize }}</span>
      </button>
      <button
        *ngIf="showRefresh"
        type="button"
        class="btn btn-light mr-2"
        (click)="eventRefresh.emit()"
        [disabled]="loading"
      >
        <i class="fa fa-refresh" [ngClass]="{ 'fa-spin': loading }"></i>
        <span>{{ 'refresh' | translate | capitalize }}</span>
      </button>
      <button type="button" class="btn btn-light mr-2" (click)="eventExport.emit(true)" [disabled]="loading">
        <i class="fa fa-download"></i>
        <span>Exportar</span>
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th *ngIf="rowButtons && rowButtons.length > 0" [width]="50">
            <i class="fa fa-bars"></i>
          </th>
          <ng-container *ngFor="let column of columns">
            <th (click)="changeSorting(column)" *ngIf="column.show !== false">
              <b>
                {{ column.label | translate | capitalize }}
                <i
                  class="fa"
                  [ngClass]="{
                    'fa-sort': sorting.column !== column.label,
                    'fa-sort-asc': sorting.column === column.label && sorting.direction === 'asc',
                    'fa-sort-desc': sorting.column === column.label && sorting.direction === 'desc',
                  }"
                ></i>
              </b>
            </th>
          </ng-container>
        </tr>
      </thead>

      <tbody>
        <tr *ngIf="loading">
          <td colspan="99" style="padding: 0px">
            <app-progressbar [loading]="loading"></app-progressbar>
          </td>
        </tr>

        <tr *ngFor="let item of data">
          <td *ngIf="rowButtons && rowButtons.length > 0" align="left">
            <button
              *ngFor="let button of rowButtons"
              [type]="'button'"
              [class]="button.class"
              (click)="runEvent(button.click, item, data)"
              [disabled]="loading"
              [title]="button.title | translate | capitalize"
            >
              <i [class]="button.icon"></i>
            </button>
          </td>
          <ng-container *ngFor="let column of columns">
            <td *ngIf="column.show !== false">
              <span
                *ngIf="column.dataType === 'status'"
                class="status-pill"
                [class.status-pill--debe]="item?.[column.label] === 'Debe'"
                [class.status-pill--pagado]="item?.[column.label] === 'Pagado'"
                [title]="item?.[column.label]"
              >
                {{ item?.[column.label] }}
              </span>
              <ng-container *ngIf="column.dataType !== 'status'">
                {{ item?.[column.label] | dynamicFormat: column.dataType }}
              </ng-container>
            </td>
          </ng-container>
        </tr>

        <tr align="center" *ngIf="(!data || data.length === 0) && !loading">
          <td colspan="99">{{ 'no data found' | translate | capitalize }}</td>
        </tr>
      </tbody>

      <tfoot *ngIf="data?.length > 0 && hasTotals">
        <tr>
          <td *ngFor="let column of columns; let i = index">
            <strong *ngIf="i > 0 && totals?.[column.label]">
              {{ totals[column.label] | dynamicFormat : column.dataType }}
            </strong>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
