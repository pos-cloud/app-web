<div class="card">
  <div class="card-header">
    <span style="color: #607d8b">{{ transactionType?.name || 'Caja' }}</span>
    <div class="pull-right">
      <button type="button" class="btn" (click)="closeModal()">
        <i class="fa fa-times"></i>
        <span>Cerrar</span>
      </button>
      <button
        type="button"
        class="btn"
        *ngIf="transactionType?.cashOpening"
        [disabled]="!cashBoxForm?.valid || loading"
        (click)="openCashBox()"
      >
        <i class="fa" [ngClass]="{ 'fa-save': !loading, 'fa-spinner fa-spin': loading }"></i>
        <span *ngIf="!loading">Abrir Caja</span>
        <span *ngIf="loading">Espere por favor</span>
      </button>
      <button
        type="button"
        class="btn"
        *ngIf="transactionType?.cashClosing"
        [disabled]="!cashBoxForm?.valid || loading"
        (click)="closeCashBox()"
      >
        <i class="fa" [ngClass]="{ 'fa-save': !loading, 'fa-spinner fa-spin': loading }"></i>
        <span *ngIf="!loading">Cerrar Caja</span>
        <span *ngIf="loading">Espere por favor</span>
      </button>
    </div>
  </div>

  <div class="card-body scroll">
    <app-progressbar [loading]="loading"></app-progressbar>

    <ng-container *ngIf="transactionType">
      <form [formGroup]="cashBoxForm" autocomplete="off" (ngSubmit)="addMovementOfCash()">
        <div class="row">
          <label class="form-group col-md-12">
            <b>Movimiento</b>
          </label>
        </div>

        <div class="row">
          <div class="form-group col-md-4">
            <label for="paymentMethod" class="control-label">Medio de pago:</label>
            <select class="form-control" formControlName="paymentMethod" id="paymentMethod">
              <option *ngFor="let paymentMethod of paymentMethods" [ngValue]="paymentMethod">
                {{ paymentMethod.name }}
              </option>
            </select>
          </div>

          <div class="form-group col-md-4" *ngIf="selectedPayment && !selectedPayment.allowCurrencyValue">
            <label for="amount" class="control-label">Monto:</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">$</span>
              </div>
              <input type="number" class="form-control" formControlName="amount" id="amount" min="0" step="any" />
            </div>
          </div>

          <div class="form-group col-md-2" *ngIf="selectedPayment && !selectedPayment.allowCurrencyValue">
            <label class="control-label">Acción:</label>
            <div class="input-group">
              <button type="submit" class="btn btn-success">
                <i class="fa fa-plus"></i>
                <span>Confirmar</span>
              </button>
            </div>
          </div>
        </div>

        <ng-container *ngIf="selectedPayment?.allowCurrencyValue">
          <div class="row" [formGroup]="formAddCurrencyValue">
            <div class="form-group col-md-4">
              <label class="control-label">Valor de moneda:</label>
              <select formControlName="currencyValue" class="form-control">
                <option [ngValue]="null" disabled>Seleccione</option>
                <option *ngFor="let currencyValue of currencyValues" [value]="currencyValue.value">
                  {{ currencyValue.value }}
                </option>
              </select>
            </div>

            <div class="form-group col-md-4">
              <label class="control-label">Cantidad:</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">$</span>
                </div>
                <input formControlName="currencyAmount" type="number" class="form-control" min="0" />
              </div>
            </div>

            <div class="form-group col-md-2">
              <label class="control-label">Acción:</label>
              <div class="input-group">
                <button type="button" class="btn btn-success" (click)="addCurrencyValue()">
                  <i class="fa fa-plus"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="row" *ngIf="currencyValuesForm?.length">
            <div class="col-md-12 table-responsive">
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th>Valor de moneda</th>
                    <th>Cantidad</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let field of currencyValuesForm; let i = index">
                    <td>{{ field.value }}</td>
                    <td>{{ field.quantity }}</td>
                    <td align="right" width="10">
                      <button type="button" class="btn btn-danger btn-sm" (click)="deleteCurrencyValue(i)">
                        <i class="fa fa-trash-o"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <td></td>
                    <td colspan="2" class="text-right">
                      <strong>Total: $ {{ totalCurrencyValue | number: '1.2-2' }}</strong>
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>

          <div class="row" *ngIf="currencyValuesForm?.length">
            <div class="form-group col-md-2">
              <label class="control-label">Acción:</label>
              <div class="input-group">
                <button type="submit" class="btn btn-success">
                  <i class="fa fa-plus"></i>
                  <span>Confirmar</span>
                </button>
              </div>
            </div>
          </div>
        </ng-container>

        <hr />

        <div class="row">
          <label class="form-group col-md-12">
            <b>Movimientos cargados</b>
          </label>
        </div>

        <div class="row" *ngIf="movementsOfCashes?.length">
          <div class="col-md-12 table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th width="80"></th>
                  <th>Método</th>
                  <th class="text-right">Monto</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let movement of movementsOfCashes">
                  <td>
                    <button
                      type="button"
                      class="btn btn-danger btn-sm"
                      title="Eliminar"
                      (click)="removeMovement(movement)"
                    >
                      <i class="fa fa-trash-o"></i>
                    </button>
                  </td>
                  <td>{{ movement.type?.name }}</td>
                  <td class="text-right">{{ movement.amountPaid | number: '1.2-2' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </form>
    </ng-container>

    <p *ngIf="!transactionType && !loading" class="text-muted">No se encontró el tipo de transacción de caja.</p>
  </div>
</div>
