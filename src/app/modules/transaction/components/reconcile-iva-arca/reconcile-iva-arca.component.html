<section class="container-fluid">
  <div class="modal-header">
    <h4 class="modal-title">Reconciliar IVA ARCA</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('close_click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <form [formGroup]="form" (ngSubmit)="reconcile()" autocomplete="off">
    <div class="modal-body">
      <p class="text-muted">
        Subí el Excel de Mis Comprobantes Emitidos. El proceso corre en segundo plano y el resultado llega por
        notificación (campanita).
      </p>
      <div class="row">
        <div class="form-group col-md-6">
          <label for="month" class="control-label">Mes:</label>
          <select
            class="form-control"
            formControlName="month"
            id="month"
            [ngClass]="{ 'is-invalid': form.get('month')?.touched && form.get('month')?.invalid }"
          >
            <option *ngFor="let month of months" [ngValue]="month">{{ month }}</option>
          </select>
        </div>
        <div class="form-group col-md-6">
          <label for="year" class="control-label">Año (*)</label>
          <input
            type="text"
            class="form-control"
            formControlName="year"
            id="year"
            maxlength="4"
            [ngClass]="{ 'is-invalid': form.get('year')?.touched && form.get('year')?.invalid }"
          />
        </div>
        <div class="form-group col-md-12">
          <label for="reconcileIvaFile" class="control-label">Excel ARCA:</label>
          <input type="file" class="form-control" id="reconcileIvaFile" accept=".xlsx,.xls" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light" (click)="activeModal.close('cancel')">Cerrar</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <i class="fa" [ngClass]="{ 'fa-upload': !loading, 'fa-spinner fa-spin': loading }"></i>
        <span *ngIf="!loading">Reconciliar</span>
        <span *ngIf="loading">Encolando...</span>
      </button>
    </div>
  </form>
</section>
