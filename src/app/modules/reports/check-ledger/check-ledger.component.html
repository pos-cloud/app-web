<section class="container-fluid">
  <div class="d-flex align-items-center justify-content-between flex-wrap">
    <div class="form-group mr-2 pt-3 check-filter">
      <label for="checkNumber" class="control-label">
        <b>{{ 'checkNumber' | translate | capitalize }}</b></label
      >
      <form [formGroup]="checkForm" (ngSubmit)="getReport()">
        <app-searchable-dropdown
          [control]="checkControl"
          [data]="movementOfCashes"
          [keyField]="'_id'"
          [displayField]="'number'"
          [minSearchLength]="1"
        ></app-searchable-dropdown>
      </form>
    </div>

    <!-- Botón de Actualizar -->
    <div class="form-group ml-auto">
      <label class="control-label"> </label>
      <button class="btn btn-primary" (click)="getReport()">
        <i [ngClass]="{ 'fa fa-refresh fa-spin': loading }"></i> {{ 'refresh' | translate | capitalize }}
      </button>
    </div>
  </div>

  <div class="card bg-light mb-3 p-3" *ngIf="header?.length">
    <div class="d-flex flex-wrap">
      <div class="p-2" *ngFor="let detail of header">
        <strong>{{ detail.label | translate | capitalize }}:</strong> {{ detail.value }}
      </div>
    </div>
  </div>

  <app-data-table-reports
    [data]="data"
    [columns]="columns"
    [totals]="totals"
    [title]="title"
    [loading]="loading"
    [rowButtons]="rowButtons"
    [(sorting)]="sort"
    (sortingChange)="onSortingChange($event)"
    (eventFunction)="onEventFunction($event)"
  >
  </app-data-table-reports>
</section>
