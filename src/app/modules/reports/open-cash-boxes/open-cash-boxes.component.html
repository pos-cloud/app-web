<section class="container-fluid open-cash-boxes">
  <div class="open-cash-boxes-header">
    <h4 class="open-cash-boxes-title mb-0">Cajas abiertas</h4>
    <button type="button" class="btn btn-primary btn-sm" (click)="getReport()" [disabled]="loading">
      <i [ngClass]="{ 'fa fa-refresh': true, 'fa-spin': loading }"></i>
      Actualizar
    </button>
  </div>

  <div class="text-center py-4" *ngIf="loading">
    <i class="fa fa-spinner fa-spin fa-2x"></i>
  </div>

  <ng-container *ngIf="!loading">
    <div class="empty-state" *ngIf="!cashBoxes.length">No hay cajas abiertas.</div>

    <div class="cash-boxes-grid" *ngIf="cashBoxes.length">
      <article class="cash-box-card" *ngFor="let cashBox of cashBoxes" (click)="openCashBoxDetail(cashBox)">
        <h5 class="cash-box-card__name">{{ cashBox.name }}</h5>
        <p class="cash-box-card__user">{{ cashBox.user || 'Sin usuario' }}</p>

        <div class="payments-list" *ngIf="cashBox.payments?.length; else emptyPayments">
          <div class="payment-item" *ngFor="let payment of cashBox.payments">
            <span class="payment-method">{{ payment.paymentMethod }}</span>
            <span class="payment-saldo">${{ formatMoney(payment.saldo) }}</span>
          </div>
        </div>
        <ng-template #emptyPayments>
          <div class="empty-payments">Sin movimientos</div>
        </ng-template>
      </article>
    </div>
  </ng-container>
</section>
