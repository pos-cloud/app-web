<section class="container-fluid">
  <div class="d-flex align-items-end justify-content-between mb-3 flex-wrap">
    <div class="form-group mr-2 flex-grow-1">
      <label for="company" class="control-label">
        <b>{{ 'company' | translate | capitalize }}</b>
      </label>
      <input
        type="text"
        class="form-control"
        name="company"
        id="company"
        [(ngModel)]="company"
        (keyup.enter)="getReport()"
        [placeholder]="'company' | translate | capitalize"
        autocomplete="off"
      />
    </div>

    <div class="form-group mr-2">
      <label for="endDate" class="control-label">
        <b>{{ 'endDate' | translate | capitalize }}</b>
      </label>
      <app-date-time-picker [(ngModel)]="endDate" name="activeEndDate"></app-date-time-picker>
    </div>

    <div class="form-group ml-auto">
      <button
        type="button"
        class="btn btn-warning mr-2"
        (click)="onAdjust($event)"
        [disabled]="loading"
      >
        <i class="fa fa-adjust"></i>
        <span>Ajustar</span>
      </button>
      <button type="button" class="btn btn-primary" (click)="getReport()" [disabled]="loading">
        <i class="fa fa-refresh" [ngClass]="{ 'fa-spin': loading }"></i>
        {{ 'refresh' | translate | capitalize }}
      </button>
    </div>
  </div>

  <app-data-table-reports
    [data]="data"
    [columns]="columns"
    [totals]="totals"
    [title]="title"
    [loading]="loading"
    [rowButtons]="rowButtons"
    [(sorting)]="sort"
    (sortingChange)="onSortingChange($event)"
    (eventExport)="onExportExcel($event)"
    (eventFunction)="onEventFunction($event)"
  >
  </app-data-table-reports>
</section>
