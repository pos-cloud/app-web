<section class="container-fluid active-members-report">
  <div class="active-members-header">
    <h4 class="active-members-title mb-0">Socios activos</h4>
    <button type="button" class="btn btn-primary btn-sm" (click)="getReport()" [disabled]="loading">
      <i [ngClass]="{ 'fa fa-refresh': true, 'fa-spin': loading }"></i>
      Actualizar
    </button>
  </div>

  <div class="form-group search-group">
    <label for="search-member" class="control-label"><b>Buscar socio</b></label>
    <input
      id="search-member"
      type="search"
      class="form-control"
      name="search"
      placeholder="Nombre, documento o teléfono"
      [(ngModel)]="search"
      (ngModelChange)="applyFilter()"
      autocomplete="off"
    />
  </div>

  <div class="text-center py-4" *ngIf="loading">
    <i class="fa fa-spinner fa-spin fa-2x"></i>
  </div>

  <div class="empty-state" *ngIf="!loading && filteredData.length === 0">
    No hay socios para mostrar.
  </div>

  <div class="members-list" *ngIf="!loading && filteredData.length">
    <article
      class="member-card"
      *ngFor="let row of filteredData"
      [class.member-card--inactive]="isInactive(row)"
      [class.member-card--warning]="isWarning(row)"
    >
      <div class="member-card__top">
        <div class="member-card__identity">
          <h5 class="member-card__name">{{ row.name }}</h5>
          <p class="member-card__meta" *ngIf="row.identificationValue || row.phones">
            <span *ngIf="row.identificationValue">{{ row.identificationValue }}</span>
            <span *ngIf="row.identificationValue && row.phones"> · </span>
            <span *ngIf="row.phones">{{ row.phones }}</span>
          </p>
        </div>
        <span
          class="member-badge"
          [class.member-badge--inactive]="isInactive(row) && !isWarning(row)"
          [class.member-badge--warning]="isWarning(row)"
        >
          {{ row.status }}
        </span>
      </div>

      <div class="member-card__status" *ngIf="!isInactive(row)">Al día</div>

      <div class="member-card__debt" *ngIf="isInactive(row)">
        <div class="debt-item">
          <span class="debt-label">Deuda</span>
          <span class="debt-value">${{ row.debtFormatted }}</span>
        </div>
        <div class="debt-item">
          <span class="debt-label">Meses</span>
          <span class="debt-value">{{ row.pendingCount }}</span>
        </div>
        <div class="debt-item">
          <span class="debt-label">Días</span>
          <span class="debt-value" [class.debt-value--warning]="isWarning(row)">{{ row.days }}</span>
        </div>
      </div>
    </article>
  </div>
</section>
