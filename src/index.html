<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="utf-8" />
    <title>POS Cloud</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="google" content="notranslate" />

    <link rel="icon" type="image/x-icon" href="./assets/img/favicon-pos.ico" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-jZO2WGIM6tH0QxM_BBBd9.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        };
      plausible.init = plausible.init || function (i) {
        plausible.o = i || {};
      };
      plausible.init();
    </script>

    <script>
      (function () {
        const hash = window.location.hash;
        if (hash) {
          const path = hash.substring(1);
          window.history.replaceState(null, '', path);
        }
      })();
    </script>
  </head>

  <body style="background-color: #e4e9f2">
    <app-root>
      <div id="fuse-splash-screen">
        <div class="center">
          <div class="logo">
            <img width="300" src="assets/img/logo.png" />
          </div>
          <div class="spinner-wrapper">
            <div class="spinner">
              <div class="inner">
                <div class="gap"></div>
                <div class="left">
                  <div class="half-circle"></div>
                </div>
                <div class="right">
                  <div class="half-circle"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </app-root>
  </body>
  <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
</html>
