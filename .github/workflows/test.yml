name: Test

on:
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - 'services/**'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Unit tests
        run: npm test -- --ci
